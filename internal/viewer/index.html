<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>goreach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 22V10h3v12zm5 0V14h3v8zm5 0v-5h3v5z' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f7f8;
  --surface: #ffffff;
  --surface-2: #f1f1f3;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --text: #18181b;
  --text-2: #52525b;
  --text-3: #8e8e96;
  --accent: #4f46e5;
  --accent-soft: #eef2ff;
  --good: #16a34a;
  --good-soft: #dcfce7;
  --warn: #ca8a04;
  --warn-soft: #fef9c3;
  --bad: #dc2626;
  --bad-soft: #fee2e2;
  --bad-line: #fdecec;
  --heat: #f97316;
  --heat-strong: #c2410c;
  --code-bg: #ffffff;
  --syn-kw: #7c3aed;
  --syn-str: #0f766e;
  --syn-com: #8e8e96;
  --syn-num: #b45309;
  --syn-fn: #2563eb;
  --syn-type: #0e7490;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0c0f; --surface: #151519; --surface-2: #1d1d23; --border: #27272f; --border-strong: #3a3a44;
    --text: #ededf0; --text-2: #a8a8b3; --text-3: #6e6e7a;
    --accent: #818cf8; --accent-soft: #1e1b4b;
    --good: #4ade80; --good-soft: #052e16; --warn: #facc15; --warn-soft: #2e2604;
    --bad: #f87171; --bad-soft: #3b0d0d; --bad-line: #2a1214;
    --heat: #fb923c; --heat-strong: #fdba74; --code-bg: #121216;
    --syn-kw: #c4b5fd; --syn-str: #5eead4; --syn-com: #6e6e7a; --syn-num: #fcd34d; --syn-fn: #93c5fd; --syn-type: #67e8f9;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0c0f; --surface: #151519; --surface-2: #1d1d23; --border: #27272f; --border-strong: #3a3a44;
  --text: #ededf0; --text-2: #a8a8b3; --text-3: #6e6e7a;
  --accent: #818cf8; --accent-soft: #1e1b4b;
  --good: #4ade80; --good-soft: #052e16; --warn: #facc15; --warn-soft: #2e2604;
  --bad: #f87171; --bad-soft: #3b0d0d; --bad-line: #2a1214;
  --heat: #fb923c; --heat-strong: #fdba74; --code-bg: #121216;
  --syn-kw: #c4b5fd; --syn-str: #5eead4; --syn-com: #6e6e7a; --syn-num: #fcd34d; --syn-fn: #93c5fd; --syn-type: #67e8f9;
  --shadow: none; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.dim { color: var(--text-2); }
.faint { color: var(--text-3); }

/* ---------- Top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--border); }
.topbar-inner { max-width: 1320px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 24px; height: 56px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -.01em; font-size: 15px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
.tabs { display: flex; gap: 2px; height: 100%; }
.tab { display: flex; align-items: center; padding: 0 12px; color: var(--text-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; gap: 6px; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.tab .count { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); font-weight: 600; }
.tab .count.alert { background: var(--bad-soft); color: var(--bad); }
.spacer { flex: 1; }
.search { position: relative; width: 300px; }
.search input { width: 100%; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); padding: 0 32px 0 30px; outline: none; font-size: 13px; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.search svg { position: absolute; left: 9px; top: 9px; color: var(--text-3); }
.search kbd { position: absolute; right: 8px; top: 7px; font: 11px var(--mono); color: var(--text-3); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; background: var(--surface-2); }
.search-results { position: absolute; top: 38px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.12); max-height: 420px; overflow: auto; display: none; padding: 4px; }
.search-results.open { display: block; }
.sr-item { display: flex; gap: 10px; align-items: baseline; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.sr-item.sel, .sr-item:hover { background: var(--accent-soft); }
.sr-item .sr-name { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-item .sr-loc { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: auto; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2); border: 1px solid var(--border); background: var(--surface); }
.icon-btn:hover { color: var(--text); }

/* ---------- Layout ---------- */
.page { max-width: 1320px; margin: 0 auto; padding: 28px 24px 64px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 20px; font-weight: 650; letter-spacing: -.015em; }
.page-head p { color: var(--text-2); font-size: 13px; margin-top: 2px; max-width: 760px; }
.meta-line { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--text-2); font-size: 12.5px; }
.meta-line b { color: var(--text); font-weight: 550; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(5, 1fr); }
.cols-3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, 1fr); } .cols-3 { grid-template-columns: 1fr; } }
@media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, 1fr); } .search { display: none; } .topbar-inner { gap: 12px; padding: 0 16px; } .page { padding: 20px 16px 48px; } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
.card-head h2 { font-size: 13.5px; font-weight: 600; }
.card-head .link { margin-left: auto; font-size: 12.5px; color: var(--accent); font-weight: 500; }
.card-body { padding: 0 16px 14px; }
.section { margin-top: 28px; }
.section-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.section-title h2 { font-size: 15px; font-weight: 620; }
.section-title p { color: var(--text-2); font-size: 12.5px; }

.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; cursor: default; }
a.kpi { cursor: pointer; }
a.kpi:hover { border-color: var(--border-strong); }
.kpi-label { font-size: 12px; color: var(--text-2); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.kpi-value { font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 12px; color: var(--text-3); }
.t td.r { white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* bars */
.bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; flex: 1; min-width: 40px; }
.bar > i { display: block; height: 100%; border-radius: 999px; }
.covcell { display: flex; align-items: center; gap: 10px; min-width: 150px; }
.covcell .pct { width: 46px; text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }

/* tables */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; font-weight: 550; color: var(--text-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; user-select: none; }
.t th.sortable { cursor: pointer; }
.t th.sortable:hover { color: var(--text-2); }
.t th.sorted { color: var(--text); }
.t th.r, .t td.r { text-align: right; }
.t td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.t tbody tr:last-child td { border-bottom: none; }
.t tbody tr.click { cursor: pointer; }
.t tbody tr.click:hover td { background: var(--surface-2); }
.t tr.group td { background: var(--surface-2); color: var(--text-2); font-size: 12px; font-weight: 600; padding: 6px 12px; }
.fn { font-family: var(--mono); font-size: 12.5px; }
.loc { color: var(--text-3); font-size: 12px; font-family: var(--mono); white-space: nowrap; }
.compact .t td { padding: 7px 0; }
.compact .t td + td { padding-left: 12px; }
.compact .t th { padding: 6px 0; }
.compact .t th + th { padding-left: 12px; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.neutral { background: var(--surface-2); color: var(--text-2); }
.percall { font-weight: 700; font-variant-numeric: tabular-nums; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { padding: 4px 12px; border-radius: 6px; font-size: 12.5px; color: var(--text-2); font-weight: 500; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); cursor: pointer; user-select: none; }
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.empty { padding: 28px 16px; text-align: center; color: var(--text-3); font-size: 13px; }
.note { font-size: 12px; color: var(--text-3); padding: 10px 16px 14px; border-top: 1px solid var(--border); }
.more { display: block; width: 100%; padding: 9px; color: var(--accent); font-weight: 500; font-size: 12.5px; border-top: 1px solid var(--border); }
.more:hover { background: var(--surface-2); }

/* ---------- Code view ---------- */
.code-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
.code-layout > * { min-width: 0; }
@media (max-width: 900px) { .code-layout { grid-template-columns: 1fr; } .tree { position: static !important; max-height: 320px !important; } }
.tree { position: sticky; top: 72px; max-height: calc(100vh - 92px); display: flex; flex-direction: column; overflow: hidden; }
.tree-filter { padding: 10px; border-bottom: 1px solid var(--border); }
.tree-filter input { width: 100%; height: 30px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); padding: 0 10px; font-size: 12.5px; outline: none; }
.tree-filter input:focus { border-color: var(--accent); }
.tree-list { overflow: auto; padding: 6px; position: relative; }
.tree-pkg { font-size: 11.5px; color: var(--text-3); font-weight: 600; padding: 8px 8px 3px; font-family: var(--mono); word-break: break-all; }
.tree-file { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px; font-family: var(--mono); font-size: 12.5px; cursor: pointer; }
.tree-file:hover { background: var(--surface-2); }
.tree-file.on { background: var(--accent-soft); color: var(--accent); }
.tree-file .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-file .p { font-size: 11px; font-variant-numeric: tabular-nums; }

.file-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.file-head .path { font-family: var(--mono); font-size: 13px; font-weight: 600; word-break: break-all; }
.outline { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.outline button { font-family: var(--mono); font-size: 11.5px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text-2); display: inline-flex; gap: 6px; align-items: center; }
.outline button:hover { color: var(--text); border-color: var(--border-strong); }
.legend { display: flex; gap: 14px; align-items: center; font-size: 11.5px; color: var(--text-3); margin-left: auto; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: -2px; margin-right: 4px; }
.heat-scale { width: 60px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, color-mix(in srgb, var(--heat) 8%, transparent), var(--heat)); display: inline-block; vertical-align: 0; margin: 0 4px; }

.code { background: var(--code-bg); font-family: var(--mono); font-size: 12.5px; line-height: 20px; overflow-x: auto; border-radius: 0 0 12px 12px; }
.ln { display: grid; grid-template-columns: 56px 64px 1fr; min-width: max-content; }
.ln > span { white-space: pre; }
.ln .no { color: var(--text-3); text-align: right; padding-right: 12px; user-select: none; }
.ln .cnt { text-align: right; padding-right: 10px; user-select: none; font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; border-right: 1px solid var(--border); }
.ln .src { padding-left: 14px; padding-right: 24px; }
.ln.miss { background: var(--bad-line); }
.ln.miss .cnt { color: var(--bad); font-weight: 600; }
.ln.fnstart .src { box-shadow: inset 0 1px 0 var(--border); }
.ln.target { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { background: color-mix(in srgb, var(--accent) 22%, transparent); } }
.ann { display: inline-flex; gap: 6px; align-items: center; margin-left: 16px; font-family: var(--sans); font-size: 11px; vertical-align: 1px; }
.ann .chip { cursor: pointer; }
.ann-fn { font-family: var(--sans); font-size: 11px; color: var(--text-3); margin-left: 16px; }
.syn-kw { color: var(--syn-kw); } .syn-str { color: var(--syn-str); } .syn-com { color: var(--syn-com); font-style: italic; }
.syn-num { color: var(--syn-num); } .syn-fn { color: var(--syn-fn); } .syn-type { color: var(--syn-type); } .syn-builtin { color: var(--syn-type); }

.blocks-list { padding: 8px 16px 16px; }
.blk { font-family: var(--mono); font-size: 12px; padding: 4px 0; color: var(--text-2); }

#loading, #error-msg { max-width: 600px; margin: 120px auto; text-align: center; color: var(--text-2); }
#error-msg { color: var(--bad); display: none; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="loading">Loading report…</div>
<div id="error-msg"></div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/overview">
        <span class="brand-mark"><svg width="14" height="14" viewBox="0 0 32 32"><path d="M6 26V8h5v18zm8 0V14h5v12zm8 0v-7h5v7z" fill="white"/></svg></span>
        goreach
      </a>
      <nav class="tabs" id="tabs">
        <a class="tab" data-route="overview" href="#/overview">Overview</a>
        <a class="tab" data-route="hotspots" href="#/hotspots">Hotspots <span class="count" id="tab-hot-count"></span></a>
        <a class="tab" data-route="coverage" href="#/coverage">Coverage <span class="count" id="tab-cov-count"></span></a>
        <a class="tab" data-route="code" href="#/code">Code</a>
      </nav>
      <div class="spacer"></div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="text" placeholder="Jump to function or file" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
        <div class="search-results" id="search-results"></div>
      </div>
      <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <main class="page" id="view"></main>
</div>

<script>
(function() {
'use strict';

/* ================= State ================= */
var R = null;            // the report
var FUNCS = [];          // every function: {pkg, file, fn, id}
var FILES = [];          // every file: {pkg, file, data}
var LOOPS = [];          // loop calls: {pkg, file, caller, fnRef, call}
var hasCalls = false;    // report has execution counts
var hasLatest = false;   // some function has latest_unreached_blocks
var sourceOK = false;
var prefix = '';         // common path prefix stripped for display
var spanHours = 0;       // collection span in hours (0 = unknown)
var srcCache = {};

var ui = {
  covMode: 'never',      // coverage tab segment
  latest: false,         // show latest-build unreached blocks
  loopsCtxOnly: false,
  hotLimit: 50,
  loopLimit: 50,
  hotSort: 'calls',
  pkgSort: 'cov',
  treeFilter: ''
};

/* ================= Helpers ================= */
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmtInt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function fmtCompact(n) {
  if (n < 1000) return String(n);
  var u = ['k', 'M', 'G', 'T'], i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (n >= 100 ? Math.round(n) : n.toFixed(1).replace(/\.0$/, '')) + u[i];
}
function fmtPct(p) { return (Math.round(p * 10) / 10).toFixed(1) + '%'; }
function fmtRatio(r) { return r >= 100 ? fmtInt(r) : r >= 10 ? r.toFixed(0) : r.toFixed(1); }
function fmtDuration(ms) {
  var m = Math.round(ms / 60000);
  if (m < 60) return m + 'm';
  var h = Math.floor(m / 60), mm = m % 60;
  if (h < 48) return h + 'h' + (mm ? ' ' + mm + 'm' : '');
  return Math.round(h / 24) + 'd';
}
function fmtTime(s) {
  var d = new Date(s);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function covColor(p) {
  if (p <= 0) return 'var(--bad)';
  if (p >= 100) return 'var(--good)';
  if (p < 50) return 'var(--warn)';
  return 'color-mix(in srgb, var(--good) ' + Math.round((p - 50) * 2) + '%, var(--warn))';
}
function covBar(p) {
  return '<div class="covcell"><div class="bar"><i style="width:' + Math.min(100, p) + '%;background:' + covColor(p) + '"></i></div>' +
    '<span class="pct" style="color:' + covColor(p) + '">' + fmtPct(p) + '</span></div>';
}
function strip(p) { return prefix && p.indexOf(prefix) === 0 ? p.slice(prefix.length) : p; }
function baseName(p) { var i = p.lastIndexOf('/'); return i >= 0 ? p.slice(i + 1) : p; }
function dirName(p) { var i = p.lastIndexOf('/'); return i >= 0 ? p.slice(0, i) : ''; }
function codeHref(file, line) { return '#/code?file=' + encodeURIComponent(file) + (line ? '&line=' + line : ''); }
function perCall(c) { return c.caller_calls > 0 ? c.executions / c.caller_calls : 0; }
function perCallChip(r) {
  var cls = r >= 10 ? 'bad' : r >= 3 ? 'warn' : 'neutral';
  return '<span class="chip ' + cls + ' percall">×' + fmtRatio(r) + '</span>';
}
function rate(n) {
  if (!spanHours) return '';
  var r = n / spanHours;
  return r >= 10 ? fmtInt(r) : r.toFixed(1);
}
function unreachedOf(fn) {
  if (ui.latest) return fn.latest_unreached_blocks || [];
  return fn.unreached_blocks || [];
}
function commonPrefix(paths) {
  if (!paths.length) return '';
  var p = paths[0];
  for (var i = 1; i < paths.length; i++) while (paths[i].indexOf(p) !== 0) p = p.slice(0, -1);
  var s = p.lastIndexOf('/');
  return s >= 0 ? p.slice(0, s + 1) : '';
}

/* ================= Go syntax highlight ================= */
var KW = {}, TY = {}, BI = {};
'break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var'.split(' ').forEach(function(w) { KW[w] = 1; });
'bool byte complex64 complex128 error float32 float64 int int8 int16 int32 int64 rune string uint uint8 uint16 uint32 uint64 uintptr any comparable'.split(' ').forEach(function(w) { TY[w] = 1; });
'append cap clear close complex copy delete imag len make max min new panic print println real recover nil true false iota'.split(' ').forEach(function(w) { BI[w] = 1; });
function hl(text) {
  var out = '', i = 0, n = text.length, m;
  while (i < n) {
    var ch = text[i], rest = text.slice(i);
    if (ch === '/' && text[i + 1] === '/') { out += '<span class="syn-com">' + esc(rest) + '</span>'; break; }
    if (ch === '/' && text[i + 1] === '*') {
      var e = text.indexOf('*/', i + 2); e = e < 0 ? n : e + 2;
      out += '<span class="syn-com">' + esc(text.slice(i, e)) + '</span>'; i = e; continue;
    }
    if (ch === '"' || ch === '\'') {
      var j = i + 1;
      while (j < n && text[j] !== ch) { if (text[j] === '\\') j++; j++; }
      out += '<span class="syn-str">' + esc(text.slice(i, j + 1)) + '</span>'; i = j + 1; continue;
    }
    if (ch === '`') {
      var k = text.indexOf('`', i + 1); k = k < 0 ? n : k + 1;
      out += '<span class="syn-str">' + esc(text.slice(i, k)) + '</span>'; i = k; continue;
    }
    if ((m = rest.match(/^(0[xX][0-9a-fA-F_]+|\d[\d_]*(\.\d+)?([eE][+-]?\d+)?)/)) && !/[A-Za-z_]/.test(text[i - 1] || '')) {
      out += '<span class="syn-num">' + esc(m[0]) + '</span>'; i += m[0].length; continue;
    }
    if ((m = rest.match(/^[A-Za-z_][A-Za-z0-9_]*/))) {
      var w = m[0], after = text[i + w.length];
      if (KW[w]) out += '<span class="syn-kw">' + w + '</span>';
      else if (TY[w]) out += '<span class="syn-type">' + w + '</span>';
      else if (BI[w]) out += '<span class="syn-builtin">' + w + '</span>';
      else if (after === '(') out += '<span class="syn-fn">' + w + '</span>';
      else out += esc(w);
      i += w.length; continue;
    }
    out += esc(ch); i++;
  }
  return out;
}

/* ================= Data prep ================= */
function prepare(rpt) {
  R = rpt;
  var paths = [];
  (rpt.packages || []).forEach(function(p) {
    (p.files || []).forEach(function(f) {
      paths.push(f.file_name);
      FILES.push({ pkg: p.import_path, file: f.file_name, data: f });
      (f.functions || []).forEach(function(fn) {
        var ref = { pkg: p.import_path, file: f.file_name, fn: fn };
        FUNCS.push(ref);
        if (typeof fn.calls === 'number') hasCalls = true;
        if (fn.latest_unreached_blocks && fn.latest_unreached_blocks.length) hasLatest = true;
        (fn.loop_calls || []).forEach(function(c) {
          LOOPS.push({ pkg: p.import_path, file: f.file_name, caller: fn.name, fnRef: ref, call: c, ratio: perCall(c) });
        });
      });
    });
  });
  prefix = paths.length > 1 ? commonPrefix(paths) : (paths[0] ? dirName(paths[0]) + '/' : '');
  // Keep the module's last path element visible: "github.com/a/app/" → "github.com/a/".
  if (prefix) {
    var trimmed = prefix.replace(/\/$/, '');
    prefix = trimmed.indexOf('/') >= 0 ? trimmed.slice(0, trimmed.lastIndexOf('/') + 1) : '';
  }
  var c = rpt.collection;
  if (c) {
    var ms = new Date(c.last_write) - new Date(c.first_write);
    if (ms >= 60000) spanHours = ms / 3600000;
  }
}
function repeatingLoops() {
  return LOOPS.filter(function(l) { return l.ratio > 1 && (!ui.loopsCtxOnly || l.call.takes_context); })
    .sort(function(a, b) { return b.call.executions - a.call.executions || b.ratio - a.ratio; });
}
function findFunc(file, name) {
  for (var i = 0; i < FUNCS.length; i++) if (FUNCS[i].file === file && FUNCS[i].fn.name === name) return FUNCS[i];
  return null;
}

/* ================= Routing ================= */
function parseRoute() {

    var i = kv.indexOf('=');

}
function render() {

function renderHot() {

/* ================= Coverage ================= */

      h += '<tr class="click" data-href="' + codeHref(x.file, firstLine) + '"><td class="fn">' + esc(fn.name) + '</td><td class="loc">' + esc(baseName(x.file)) + ':' + fn.line + '</td>' +
        '<td class="r num">' + (partial ? fn.total_statements - fn.covered_statements : fn.total_statements) + '</td>' +
        (partial ? '<td class="loc">' + mergeRanges(blocks).slice(0, 4).map(function(b) { return b[0] === b[1] ? 'L' + b[0] : 'L' + b[0] + '–' + b[1]; }).join(', ') + (mergeRanges(blocks).length > 4 ? ' …' : '') + '</td>' : '') +
        '<td style="width:170px">' + covBar(fn.coverage_percent) + '</td>' +
        (hasCalls ? '<td class="r num dim">' + (typeof fn.calls === 'number' ? fmtInt(fn.calls) : '—') + '</td>' : '') + '</tr>';
    });
  });
  el.innerHTML = h + '</tbody></table>';
}
function mergeRanges(blocks) {
  var s = blocks.slice().sort(function(a, b) { return a.start_line - b.start_line; }), out = [];
  s.forEach(function(b) {
    var last = out[out.length - 1];
    if (last && b.start_line <= last[1] + 1) last[1] = Math.max(last[1], b.end_line);
    else out.push([b.start_line, b.end_line]);
  });
  return out;
}

/* ================= Code ================= */
function viewCode(el, params) {
  var file = params.file;
  if (!file || !FILES.some(function(f) { return f.file === file; })) {
    // Default: the file with the most calls, else the first.
    var best = FILES[0];
    FILES.forEach(function(f) {
      var c = (f.data.functions || []).reduce(function(s, fn) { return s + (fn.calls || 0); }, 0);
      if (!best || c > (best._c || 0)) { best = f; best._c = c; }
    });
    file = best ? best.file : null;
  }
  el.innerHTML = '<div class="code-layout"><aside class="card tree"><div class="tree-filter"><input id="tree-filter" placeholder="Filter files" value="' + esc(ui.treeFilter) + '"></div><div class="tree-list" id="tree-list"></div></aside>' +
    '<section class="card" id="file-pane"></section></div>';
  renderTree(file);
  document.getElementById('tree-filter').addEventListener('input', function() { ui.treeFilter = this.value; renderTree(file); });
  if (file) renderFile(file, params.line ? parseInt(params.line, 10) : 0);
  else document.getElementById('file-pane').innerHTML = '<div class="empty">The report lists no files.</div>';
}
function renderTree(current) {
  var q = ui.treeFilter.toLowerCase();
  var byPkg = {};
  FILES.forEach(function(f) {
    if (q && f.file.toLowerCase().indexOf(q) < 0) return;
    (byPkg[f.pkg] || (byPkg[f.pkg] = [])).push(f);
  });
  var h = '';
  Object.keys(byPkg).sort().forEach(function(pkg) {
    h += '<div class="tree-pkg">' + esc(strip(pkg) || pkg) + '</div>';
    byPkg[pkg].sort(function(a, b) { return a.file < b.file ? -1 : 1; }).forEach(function(f) {
      var p = f.data.total.coverage_percent;
      h += '<a class="tree-file' + (f.file === current ? ' on' : '') + '" href="' + codeHref(f.file) + '"><span class="nm">' + esc(baseName(f.file)) + '</span><span class="p" style="color:' + covColor(p) + '">' + Math.round(p) + '%</span></a>';
    });
  });
  var list = document.getElementById('tree-list');
  list.innerHTML = h || '<div class="empty">No matching files.</div>';
  var on = list.querySelector('.tree-file.on');
  if (on) list.scrollTop = Math.max(0, on.offsetTop - list.clientHeight / 2);
}
function fileFuncs(file) {
  var f = FILES.filter(function(x) { return x.file === file; })[0];
  return f ? (f.data.functions || []).slice().sort(function(a, b) { return a.line - b.line; }) : [];
}
function renderFile(file, line) {
  var pane = document.getElementById('file-pane');
  var f = FILES.filter(function(x) { return x.file === file; })[0];
  var funcs = fileFuncs(file);
  var calls = funcs.reduce(function(s, fn) { return s + (fn.calls || 0); }, 0);
  var hasBlocks = funcs.some(function(fn) { return fn.blocks && fn.blocks.length; });

  var head = '<div class="file-head"><div style="flex:1;min-width:0"><div class="path">' + esc(strip(file)) + '</div>' +
    '<div class="meta-line" style="margin-top:4px"><span><b>' + funcs.length + '</b> functions</span>' + (hasCalls ? '<span><b>' + fmtCompact(calls) + '</b> calls</span>' : '') + '</div></div>' +
    '<div style="width:200px">' + covBar(f.data.total.coverage_percent) + '</div></div>';
  var outline = funcs.length ? '<div class="outline">' + funcs.map(function(fn) {
    return '<button data-line="' + fn.line + '" title="' + esc(fn.name) + '"><span style="width:6px;height:6px;border-radius:50%;background:' + covColor(fn.coverage_percent) + '"></span>' + esc(fn.name.replace(/^\(.*\)\./, '.')) +
      (typeof fn.calls === 'number' ? ' <span class="faint">' + fmtCompact(fn.calls) + '</span>' : '') + '</button>';
  }).join('') + '</div>' : '';

  if (!sourceOK) {
    var h = head + outline + '<div class="note" style="border-top:none">Source preview is off. Run <span class="mono">goreach view -src &lt;module root&gt;</span> to see execution counts line by line.</div><div class="blocks-list">';
    funcs.forEach(function(fn) {
      var b = unreachedOf(fn);
      h += '<div class="blk" id="L' + fn.line + '"><b class="fn">' + esc(fn.name) + '</b> <span class="faint">L' + fn.line + '</span> ' + covBar(fn.coverage_percent).replace('class="covcell"', 'class="covcell" style="display:inline-flex;width:180px;vertical-align:middle"') +
        (b.length ? ' <span class="loc">unreached ' + mergeRanges(b).map(function(r) { return 'L' + r[0] + (r[1] !== r[0] ? '–' + r[1] : ''); }).join(', ') + '</span>' : '') + '</div>';
    });
    pane.innerHTML = h + '</div>';
    bindOutline(pane);
    return;
  }

  var legend = '<div class="legend">' + (hasBlocks ? '<span>runs <span class="heat-scale"></span> more</span>' : '') +
    '<span><span class="sw" style="background:var(--bad-line);border:1px solid var(--bad-soft)"></span>never ran</span>' +
    (hasBlocks ? '<span class="faint">counts: newest build</span>' : '') + '</div>';
  pane.innerHTML = head + outline.replace('</div>', legend + '</div>') + '<div class="code" id="code"><div class="empty">Loading source…</div></div>';
  if (!outline) pane.querySelector('.file-head').insertAdjacentHTML('afterend', '<div class="outline">' + legend + '</div>');
  bindOutline(pane);

  loadSource(file).then(function(lines) {
    var code = document.getElementById('code');
    if (!code) return;
    code.innerHTML = renderLines(file, funcs, lines, hasBlocks);
    if (line) {
      var t = document.getElementById('L' + line);
      if (t) { centerOn(t, false); t.classList.add('target'); }
    } else {
      window.scrollTo(0, 0);
    }
  }).catch(function(err) {
    var code = document.getElementById('code');
    if (code) code.innerHTML = '<div class="empty">Could not load the source: ' + esc(err.message) + '</div>';
  });
}
function bindOutline(pane) {
  pane.querySelectorAll('.outline button[data-line]').forEach(function(b) {
    b.addEventListener('click', function() {
      var t = document.getElementById('L' + b.getAttribute('data-line'));
      if (!t) return;
      centerOn(t, true);
      t.classList.remove('target'); void t.offsetWidth; t.classList.add('target');
    });
  });
}
// centerOn scrolls the window, and only the window, so el is mid-screen.
// scrollIntoView would also scroll the code box sideways to a long line.
function centerOn(el, smooth) {
  var y = el.getBoundingClientRect().top + window.scrollY - window.innerHeight / 2;
  window.scrollTo({ top: Math.max(0, y), left: 0, behavior: smooth ? 'smooth' : 'auto' });
}
function loadSource(file) {
  if (srcCache[file]) return Promise.resolve(srcCache[file]);
  return fetch('/api/source?file=' + encodeURIComponent(file) + '&start=1&end=1000000').then(function(r) {
    if (!r.ok) return r.text().then(function(t) { throw new Error(t.trim() || 'HTTP ' + r.status); });
    return r.json();
  }).then(function(d) { srcCache[file] = d.lines; return d.lines; });
}
function renderLines(file, funcs, lines, hasBlocks) {
  // Per-line execution counts from the blocks: a line runs as often as the
  // most-run block touching it; a line touched only by blocks that never ran
  // never ran.
  var count = {}, touched = {}, max = 0;
  var fnAt = {}, loopAt = {};
  funcs.forEach(function(fn) {
    fnAt[fn.line] = fn;
    (fn.blocks || []).forEach(function(b) {
      for (var l = b.start_line; l <= b.end_line; l++) {
        touched[l] = true;
        if (b.count > (count[l] || 0)) count[l] = b.count;
      }
      if (b.count > max) max = b.count;
    });
    (fn.loop_calls || []).forEach(function(c) { (loopAt[c.line] || (loopAt[c.line] = [])).push(c); });
  });
  var logMax = Math.log(1 + max);
  var h = '';
  lines.forEach(function(l) {
    var n = l.number, cls = 'ln', cnt = '', style = '';
    if (hasBlocks) {
      if (touched[n]) {
        if (count[n] > 0) {
          var pct = Math.round(5 + 27 * Math.log(1 + count[n]) / logMax);
          style = ' style="background:color-mix(in srgb, var(--heat) ' + pct + '%, transparent)"';
          cnt = fmtCompact(count[n]);
        } else { cls += ' miss'; cnt = '0'; }
      }
    } else if (ui.latest ? l.latest_unreached : l.unreached) {
      cls += ' miss';
    }
    var fn = fnAt[n];
    if (fn) cls += ' fnstart';
    var ann = '';
    if (fn) {
      ann += '<span class="ann-fn">' + (typeof fn.calls === 'number' ? fmtInt(fn.calls) + ' call' + (fn.calls === 1 ? '' : 's') + ' · ' : '') + fmtPct(fn.coverage_percent) + ' covered</span>';
    }
    (loopAt[n] || []).forEach(function(c) {
      var r = perCall(c);
      if (r <= 1) return;
      var target = c.callee ? findFunc(c.callee_file, c.callee) : null;
      ann += '<span class="ann">' + perCallChip(r).replace('class="chip', (target ? 'data-href="' + codeHref(target.file, target.fn.line) + '" ' : '') + 'title="' + esc(c.expr) + ' ran ' + fmtInt(c.executions) + ' times in ' + fmtInt(c.caller_calls) + ' calls" class="chip') +
        '<span class="faint">per call' + (c.callee ? ' → ' + esc(c.callee) : '') + '</span></span>';
    });
    h += '<div class="' + cls + '" id="L' + n + '"' + style + '><span class="no">' + n + '</span><span class="cnt">' + cnt + '</span><span class="src">' + hl(l.text) + ann + '</span></div>';
  });
  return h;
}

/* ================= Search ================= */
var sr = { items: [], sel: 0 };
function search(q) {
  q = q.trim().toLowerCase();
  var box = document.getElementById('search-results');
  if (!q) { box.classList.remove('open'); return; }
  var res = [];
  FUNCS.forEach(function(x) {
    var n = x.fn.name.toLowerCase(), i = n.indexOf(q);
    if (i >= 0) res.push({ score: (i === 0 ? 0 : 1) + n.length / 1000, name: x.fn.name, loc: strip(x.file) + ':' + x.fn.line, href: codeHref(x.file, x.fn.line) });
  });
  FILES.forEach(function(f) {
    if (f.file.toLowerCase().indexOf(q) >= 0) res.push({ score: 2, name: baseName(f.file), loc: strip(dirName(f.file)), href: codeHref(f.file) });
  });
  res.sort(function(a, b) { return a.score - b.score; });
  sr.items = res.slice(0, 30); sr.sel = 0;
  box.innerHTML = sr.items.length ? sr.items.map(function(it, i) {
    return '<div class="sr-item' + (i === 0 ? ' sel' : '') + '" data-i="' + i + '"><span class="sr-name">' + esc(it.name) + '</span><span class="sr-loc">' + esc(it.loc) + '</span></div>';
  }).join('') : '<div class="empty">No match.</div>';
  box.classList.add('open');
}
function pickSearch(i) {
  var it = sr.items[i]; if (!it) return;
  var input = document.getElementById('search');
  input.value = ''; input.blur();
  document.getElementById('search-results').classList.remove('open');
  location.hash = it.href;
}

/* ================= Events ================= */
function bindGlobal() {
  window.addEventListener('hashchange', render);
  document.addEventListener('click', function(e) {
    var s = e.target.closest('th[data-pkgsort]');
    if (s) { ui.pkgSort = s.getAttribute('data-pkgsort'); renderPkgTable(); return; }
    s = e.target.closest('th[data-hotsort]');
    if (s) { ui.hotSort = s.getAttribute('data-hotsort'); renderHot(); return; }
    var it = e.target.closest('.sr-item');
    if (it) { pickSearch(+it.getAttribute('data-i')); return; }
    if (e.target.closest('a')) return;
    var row = e.target.closest('[data-href]');
    if (row && row.getAttribute('data-href')) { location.hash = row.getAttribute('data-href'); return; }
    if (!e.target.closest('.search')) document.getElementById('search-results').classList.remove('open');
  });
  var input = document.getElementById('search');
  input.addEventListener('input', function() { search(this.value); });
  input.addEventListener('focus', function() { if (this.value) search(this.value); });
  input.addEventListener('keydown', function(e) {
    var box = document.getElementById('search-results');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sr.sel = Math.max(0, Math.min(sr.items.length - 1, sr.sel + (e.key === 'ArrowDown' ? 1 : -1)));
      box.querySelectorAll('.sr-item').forEach(function(el, i) { el.classList.toggle('sel', i === sr.sel); if (i === sr.sel) el.scrollIntoView({ block: 'nearest' }); });
    } else if (e.key === 'Enter') { pickSearch(sr.sel); }
    else if (e.key === 'Escape') { this.blur(); box.classList.remove('open'); }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); input.focus(); }
  });
  document.getElementById('theme-btn').addEventListener('click', function() {
    var root = document.documentElement;
    var dark = root.getAttribute('data-theme') ? root.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem('goreach-theme', dark ? 'light' : 'dark'); } catch (_) {}
  });
}

try { var th = localStorage.getItem('goreach-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (_) {}

Promise.all([
  fetch('/api/report').then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
  fetch('/api/capabilities').then(function(r) { return r.ok ? r.json() : { source_preview: false }; })
]).then(function(res) {
  prepare(res[0]);
  sourceOK = res[1].source_preview === true;
  var loops = repeatingLoops().length;
  var hc = document.getElementById('tab-hot-count');
  if (loops) { hc.textContent = loops; hc.classList.add('alert'); hc.title = loops + ' calls repeat inside loops'; } else hc.remove();
  var never = FUNCS.filter(function(x) { return x.fn.coverage_percent === 0; }).length;
  var cc = document.getElementById('tab-cov-count');
  if (never) { cc.textContent = never; cc.title = never + ' functions never ran'; } else cc.remove();
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  bindGlobal();
  render();
}).catch(function(err) {
  document.getElementById('loading').classList.add('hidden');
  var el = document.getElementById('error-msg');
  el.style.display = 'block';
  el.textContent = 'Failed to load report: ' + err.message;
});
})();
</script>
