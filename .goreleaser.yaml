version: 2

builds:
  - main: ./cmd/goreach
    binary: goreach
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

brews:
  - name: goreach
    repository:
      owner: yag13s
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/yag13s/goreach"
    description: "Find unreached code paths in running Go services."
    license: "MIT"
    install: |
      bin.install "goreach"
    test: |
      system "#{bin}/goreach", "--help"

changelog:
  sort: asc
