version: 2

builds:
  - main: ./cmd/goreach
    binary: goreach
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  # Let a failed release be re-run: without this, the second attempt stops at
  # the first asset that the failed attempt already uploaded.
  replace_existing_artifacts: true

homebrew_casks:
  - name: goreach
    repository:
      owner: yag13s
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/yag13s/goreach"
    description: "Find unreached code paths in running Go services."
    license: "MIT"

changelog:
  sort: asc
